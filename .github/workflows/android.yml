name: Build SK WhatsApp APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SKWhatsApp_AndroidStudio_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip SKWhatsApp_AndroidStudio_Project.zip
          ls -la SKWhatsApp

      - name: Build APK
        run: |
          cd SKWhatsApp
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKWhatsApp-APK
          path: SKWhatsApp/app/build/outputs/apk/debug/*.apk
